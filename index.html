<html lang="zh-CN">

<title>星语阁 · 探索未知的自己</title>
<style>
:root {
  --bg:#080b20; --panel:#111731; --line:#49458c;
  --purple:#a995ff; --pink:#f3c2ed; --text:#f5efff;
  --muted:#c3bbdf;
}
* { box-sizing:border-box }
body {
  margin:0;color:var(--text);
  font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at top,#292052,var(--bg) 55%);
}
body:before {
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(2px 2px at 15% 25%,white 99%,transparent),
  radial-gradient(1px 1px at 70% 60%,white 99%,transparent),
  radial-gradient(2px 2px at 85% 15%,#d7baff 99%,transparent);
  background-size:180px 160px;
  animation:twinkle 4s infinite alternate;
}
@keyframes twinkle {to{opacity:.8}}
@keyframes float {50%{transform:translateY(-9px)}}
@keyframes rotate {to{transform:rotate(360deg)}}
@keyframes glow {
  50%{filter:drop-shadow(0 0 14px #b6a0ff)}
}
@keyframes shuffle {
  25%{transform:translate(-13px,-5px) rotate(-9deg)}
  50%{transform:translate(13px,5px) rotate(9deg)}
  75%{transform:translate(-7px,3px) rotate(-5deg)}
}
@keyframes enter {
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
header {
  position:sticky;top:0;z-index:3;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 5%;background:#090d22ed;
  border-bottom:1px solid #37335f;backdrop-filter:blur(12px);
}
.brand {font:26px Georgia,serif;letter-spacing:5px}
.brand span {color:var(--pink);animation:glow 3s infinite}
nav {display:flex;gap:24px}
nav a {color:var(--muted);text-decoration:none}
button {font:inherit;cursor:pointer}
.btn {
  color:white;border:1px solid #9b86ff;border-radius:25px;
  padding:9px 18px;background:linear-gradient(110deg,#392b78,#263d83);
  transition:.25s;
}
.btn:hover {transform:translateY(-2px);box-shadow:0 0 20px #9b86ff55}
.hero {
  text-align:center;padding:48px 15px;
  border-bottom:1px solid #37335f;position:relative;overflow:hidden;
}
.hero h1 {font-size:clamp(40px,7vw,65px);letter-spacing:12px;margin:8px}
.hero p {color:var(--muted)}
.hero .subtitle {letter-spacing:4px;color:var(--pink)}
.hero-star {font-size:30px;animation:glow 3s infinite}
.orbit {
  position:absolute;width:140px;height:140px;border:1px solid #8e80d888;
  border-radius:50%;left:8%;top:35px;animation:rotate 30s linear infinite;
}
.orbit:after {
  content:"";position:absolute;inset:20px;border:1px solid #e5b9ff88;
  border-radius:50%;transform:scaleX(1.5) rotate(45deg);
}
main {max-width:1250px;margin:auto;padding:30px 20px}
.section-title {margin-bottom:20px}
.section-title h2 {margin:0;font-family:Georgia,serif}
.section-title p {color:var(--muted);font-size:13px}
.grid {display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card {
  overflow:hidden;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(150deg,#141a38,#090e23);
  animation:enter .5s both;transition:.3s;
}
.card:hover {transform:translateY(-5px);border-color:var(--purple)}
.art {
  height:130px;display:grid;place-items:center;position:relative;
  overflow:hidden;background:radial-gradient(circle,#34245f,#101630 70%);
}
.art:before {
  content:"";position:absolute;width:150px;height:70px;
  border:1px solid #b39bff99;border-radius:50%;transform:rotate(-25deg);
  animation:rotate 25s linear infinite;
}
.art:after {
  content:"";position:absolute;width:100px;height:100px;
  border:1px solid #f3c2ed55;border-radius:50%;
}
.art svg {width:85px;height:85px;z-index:1;animation:float 5s ease-in-out infinite}
.card-content {padding:13px}
.card h3 {margin:0 0 8px;font-size:17px}
.card p {font-size:13px;line-height:1.7;color:var(--muted);min-height:45px}
.card .btn {display:block;margin:12px auto 0}
.quote {
  padding:20px;text-align:center;border:1px solid var(--line);
  border-radius:12px;background:#101630;display:flex;
  flex-direction:column;justify-content:center;
}
.quote svg {width:45px;height:45px;margin:auto;animation:glow 3s infinite}
.quote p {line-height:2;color:var(--muted)}
footer {text-align:center;padding:20px;color:#9992c4;border-top:1px solid #37335f;font-size:13px}
.modal {
  display:none;position:fixed;inset:0;z-index:10;
  background:#020413df;align-items:center;justify-content:center;padding:14px;
}
.modal.open {display:flex}
.dialog {
  width:min(700px,100%);max-height:90vh;overflow:auto;
  border:1px solid #7868cb;border-radius:17px;padding:22px;
  background:linear-gradient(145deg,#19183c,#090f24);
  animation:enter .25s;
}
.dialog-head {display:flex;justify-content:space-between;align-items:center}
.dialog h2 {margin:0}
.close {background:none;border:0;color:white;font-size:28px}
.muted {color:var(--muted);font-size:13px;line-height:1.8}
.question {margin:22px 0;font-size:18px}
.options {display:grid;gap:10px}
.option {
  text-align:left;padding:13px;color:white;background:#151b3b;
  border:1px solid #484779;border-radius:10px;
}
.option:hover {border-color:var(--purple);background:#28224f}
.progress {height:4px;background:#28294c;margin-top:15px}
.progress span {display:block;height:100%;background:var(--pink);transition:.3s}
.result {padding:17px;margin-top:14px;background:#111831;border-radius:12px;line-height:1.8}
.result h3 {color:var(--pink)}
.result-title {font-size:25px;color:#e0c7ff}
.actions {display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.secondary {background:#141a36;border:1px solid #55518b;color:white;border-radius:24px;padding:9px 15px}
.tarot-stack {height:115px;display:flex;justify-content:center;align-items:center;position:relative;margin:20px}
.back-card {
  position:absolute;width:65px;height:100px;border:1px solid #d1b7ff;
  border-radius:8px;background:repeating-linear-gradient(45deg,#292052 0 5px,#171536 5px 10px);
  display:grid;place-items:center;color:#f1d5ff;font-size:27px;
}
.back-card:nth-child(1){transform:translateX(-25px) rotate(-12deg)}
.back-card:nth-child(2){transform:translateX(0)}
.back-card:nth-child(3){transform:translateX(25px) rotate(12deg)}
.shuffling .back-card {animation:shuffle .6s infinite}
.spread {display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.tarot-slot {text-align:center;min-width:0}
.position {font-size:13px;color:#d4bfff;margin-bottom:8px}
.flip-card {height:165px;perspective:800px;cursor:pointer}
.flip-inner {height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s}
.flip-card.flipped .flip-inner {transform:rotateY(180deg)}
.face {
  position:absolute;inset:0;backface-visibility:hidden;border:1px solid #a58bff;
  border-radius:9px;background:radial-gradient(circle,#40316c,#131832);
  display:flex;align-items:center;justify-content:center;flex-direction:column;padding:6px;
}
.face.back {background:repeating-linear-gradient(45deg,#211a47 0 5px,#151633 5px 10px)}
.face.back:after {content:"✧";font-size:42px;animation:glow 2s infinite}
.face.front {transform:rotateY(180deg)}
.face .sigil {font-size:34px;color:#f2d5ff;animation:glow 3s infinite}
.face strong {font-size:13px;margin-top:7px}
.face small {font-size:11px;color:var(--muted);margin-top:5px}
.zodiac-list {display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zodiac {
  padding:12px 5px;background:#141a36;border:1px solid #494779;
  color:white;border-radius:10px;
}
.zodiac:hover {border-color:var(--purple)}
.zodiac .glyph {display:block;font-size:25px;color:var(--pink)}
.history-item {padding:12px 0;border-bottom:1px solid #35345f}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){
  nav{display:none}.brand{font-size:22px}.orbit{left:-80px}
  main{padding:20px 12px}.grid{gap:9px}.art{height:100px}
  .art svg{width:65px;height:65px}.card-content{padding:10px}
  .card h3{font-size:15px}.card p{font-size:12px;min-height:65px}
  .card .btn{padding:7px 10px;font-size:12px}
  .dialog{padding:16px}.flip-card{height:145px}
  .face .sigil{font-size:27px}.face strong{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

["星星","☆","希望与修复","小小的进展也值得肯定，恢复信心不必一蹴而就。"],
["月亮","☾","迷雾与想象","信息不完整时，先别让猜测替代事实。"],
["太阳","☼","活力与清晰","把注意力放回能带来活力的人和事。"],
["世界","◎","整合与完成","回顾已经走过的路，认可积累，并为下一阶段留出空间。"]
];
const zodiac=[
["白羊座","♈","3/21–4/19","热情、直接、行动力强"],
["金牛座","♉","4/20–5/20","稳定、耐心、重视感官体验"],
["双子座","♊","5/21–6/21","好奇、灵活、喜欢交流"],
["巨蟹座","♋","6/22–7/22","细腻、重视归属感"],
["狮子座","♌","7/23–8/22","表达力强、有创造力"],
["处女座","♍","8/23–9/22","细致、务实、善于整理"],
["天秤座","♎","9/23–10/23","重视平衡、审美与合作"],
["天蝎座","♏","10/24–11/22","专注、深刻、观察敏锐"],
["射手座","♐","11/23–12/21","热爱探索、坦率、乐观"],
["摩羯座","♑","12/22–1/19","自律、务实、重视长期目标"],
["水瓶座","♒","1/20–2/18","独立、创新、重视理念"],
["双鱼座","♓","2/19–3/20","富有想象力、感受细腻"]
];

const $=s=>document.querySelector(s);
let current="",answers=[],drawn=[null,null,null],flipped=[false,false,false],shuffleTimer=null;
const positions=["过去","现在","未来"];
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderCards(){
  $("#cards").innerHTML=modules.map((m,i)=>`
  <article class="card" style="animation-delay:${i*60}ms">
    <div class="art">${icons[m[0]]}</div>
    <div class="card-content"><h3>${m[1]}</h3><p>${m[2]}</p>
    <button class="btn" onclick="openModule('${m[0]}')">${m[3]} →</button></div>
  </article>`).join("")+`
  <aside class="quote"><div style="color:#d7c3ff;font-size:34px">✧</div>
  <p>“每一次探索，<br>都是一次与自己的相遇。”</p>
  <div style="color:#c7b8ff">✦　◇　⌂　♡</div></aside>`;
}
function openModal(title,html){
  $("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;
  $("#modal").classList.add("open");document.body.style.overflow="hidden";
}
function closeModal(){
  clearTimeout(shuffleTimer);shuffleTimer=null;
  $("#modal").classList.remove("open");document.body.style.overflow="";
}
function openModule(id){
  if(id==="tarot")tarotStart();
  else if(id==="zodiac")zodiacStart();
  else startTest(id);
}
function startTest(id){current=id;answers=[];renderQuestion()}
function renderQuestion(){
  let qs=bank[current],i=answers.length;
  if(i>=qs.length){showResult();return}
  let q=qs[i];
  openModal(modules.find(m=>m[0]===current)[1],`
    <div class="muted">问题 ${i+1}/${qs.length} · 选择最符合你的一项</div>
    <div class="progress"><span style="width:${i/qs.length*100}%"></span></div>
    <div class="question">${safe(q[0])}</div>
    <div class="options">${q[1].map((o,j)=>`<button class="option" onclick="answer(${j})">${safe(o)}</button>`).join("")}</div>
    <div class="actions"><button class="secondary" onclick="closeModal()">暂时退出</button></div>`);
}
function answer(j){answers.push(j);renderQuestion()}
function showResult(){
  let scores=[0,0,0,0];
  bank[current].forEach((q,i)=>scores[q[2][answers[i]]??0]++);
  let item=results[current][scores.indexOf(Math.max(...scores))];
  let r={type:modules.find(m=>m[0]===current)[1],name:item[0],desc:item[1],date:new Date().toLocaleString("zh-CN")};
  save(r);
  openModal("你的测试结果",`<div class="result"><div class="muted">本次探索 · 仅供娱乐与自我认识</div>
    <div class="result-title">${safe(item[0])}</div><p>${safe(item[1])}</p>
    <p class="muted">测试结果不是专业心理评估，也不能决定你的能力或未来。</p></div>
    <div class="actions"><button class="btn" onclick="copyLatest()">复制结果</button>
    <button class="secondary" onclick="startTest('${current}')">重新测试</button>
    <button class="secondary" onclick="closeModal()">完成</button></div>`);
}
function save(r){
  let a=[];try{a=JSON.parse(localStorage.getItem("xyg_history")||"[]")}catch(e){}
  a.unshift(r);localStorage.setItem("xyg_history",JSON.stringify(a.slice(0,30)));
  localStorage.setItem("xyg_latest",JSON.stringify(r));
}
function copyLatest(){
  let r=JSON.parse(localStorage.getItem("xyg_latest")||"{}");
  let t=`${r.type||""}：${r.name||""}\n${r.desc||""}`;
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert("已复制")).catch(()=>prompt("复制结果：",t));
  else prompt("复制结果：",t);
}

/* 三张塔罗牌：洗牌、抽牌、3D翻面、综合解读 */
function tarotStart(){
  drawn=[null,null,null];flipped=[false,false,false];
  openModal("塔罗牌占卜 · 三张牌阵",`
    <p class="muted">静下心来，想一个希望理解的问题。依次抽取三张牌：过去、现在、未来。塔罗仅作为自我反思与娱乐，不是确定的预言。</p>
    <div class="tarot-stack" id="stack"><div class="back-card">✧</div><div class="back-card">☾</div><div class="back-card">✦</div></div>
    <p class="muted" id="tarotHint">第一步：点击开始洗牌。</p>
    <div id="spread"></div>
    <div class="actions"><button class="btn" id="shuffleBtn" onclick="shuffleTarot()">开始洗牌</button><button class="secondary" onclick="closeModal()">稍后再说</button></div>`);
}
function shuffleTarot(){
  if(shuffleTimer)return;
  if(drawn.every(Boolean)&&flipped.every(Boolean)){tarotStart();return}
  $("#shuffleBtn").disabled=true;$("#shuffleBtn").textContent="洗牌中…";
  $("#stack").classList.add("shuffling");$("#tarotHint").textContent="让思绪慢慢沉静下来……";
  shuffleTimer=setTimeout(()=>{
    shuffleTimer=null;$("#stack").classList.remove("shuffling");
    $("#shuffleBtn").disabled=false;$("#shuffleBtn").textContent="抽取下一张牌";
    $("#tarotHint").textContent="洗牌完成，点击牌背抽取三张牌。";
    updateSpread();
  },1100);
}
function drawTarot(i){
  if(!$("#spread").innerHTML){$("#tarotHint").textContent="请先点击开始洗牌。";return}
  if(drawn[i]){flipped[i]=true;updateSpread();checkTarot();return}
  let used=drawn.filter(Boolean).map(x=>x.index);
  let pool=tarot.map((_,n)=>n).filter(n=>!used.includes(n));
  let index=pool[Math.floor(Math.random()*pool.length)];
  drawn[i]={index,card:tarot[index]};flipped[i]=true;
  updateSpread();checkTarot();
}
function updateSpread(){
  $("#spread").innerHTML=`<div class="spread">${positions.map((p,i)=>{
    let d=drawn[i];
    return `<div class="tarot-slot"><div class="position">${p}</div>
    <div class="flip-card ${d&&flipped[i]?"flipped":""}" onclick="drawTarot(${i})">
      <div class="flip-inner"><div class="face back"></div>
      <div class="face front">${d?`<span class="sigil">${d.card[1]}</span><strong>${d.card[0]}</strong><small>${d.card[2]}</small>`:`<span class="sigil">✧</span><strong>抽取此牌</strong><small>点击牌背</small>`}</div></div></div></div>`;
  }).join("")}</div>`;
}
function checkTarot(){
  let n=drawn.filter(Boolean).length;
  $("#tarotHint").textContent=n<3?`已抽取 ${n}/3 张，请继续抽牌。`:flipped.every(Boolean)?"三张牌已翻开，可以查看综合解读。":"三张牌已抽齐，请查看每张牌面。";
  if(n===3&&flipped.every(Boolean)){
    $("#shuffleBtn").textContent="查看综合解读";$("#shuffleBtn").onclick=tarotSummary;
  }
}
function tarotSummary(){
  if(!drawn.every(Boolean)||!flipped.every(Boolean)){alert("请先抽齐并翻开三张牌。");return}
  let body=drawn.map((d,i)=>`<div class="result"><h3>${positions[i]} · ${d.card[1]} ${d.card[0]}</h3><b>${d.card[2]}</b><p>${d.card[3]}</p></div>`).join("");
  let desc=drawn.map((d,i)=>`${positions[i]}：${d.card[3]}`).join("\n");
  save({type:"塔罗牌占卜",name:drawn.map(d=>d.card[0]).join(" · "),desc,date:new Date().toLocaleString("zh-CN")});
  openModal("你的三张牌解读",`<p class="muted">以下内容是象征性的思考提示，不代表命运定论。</p>${body}
  <div class="result"><h3>综合提醒</h3><p>回顾过去的经验，观察当下能掌握的部分，再把未来拆成可以行动的小步骤。重要选择仍应结合真实信息和自己的判断。</p></div>
  <div class="actions"><button class="btn" onclick="copyLatest()">复制解读</button><button class="secondary" onclick="tarotStart()">重新抽牌</button><button class="secondary" onclick="closeModal()">完成</button></div>`);
}

function zodiacStart(){
  openModal("星座占卜",`<p class="muted">选择你的太阳星座，查看性格关键词。星座内容仅供娱乐参考。</p>
  <div class="zodiac-list">${zodiac.map((z,i)=>`<button class="zodiac" onclick="showZodiac(${i})"><span class="glyph">${z[1]}</span>${z[0]}<small style="display:block;color:#bdb4dd">${z[2]}</small></button>`).join("")}</div>`);
}
function showZodiac(i){
  let z=zodiac[i],desc=`${z[3]}。你不必完全符合星座描述；认识自己还要结合经历、选择和价值观。`;
  save({type:"星座占卜",name:z[0],desc,date:new Date().toLocaleString("zh-CN")});
  openModal(z[1]+" "+z[0],`<div class="result"><div class="result-title">${z[0]}</div><p class="muted">${z[2]}</p><p>${desc}</p></div>
  <div class="actions"><button class="btn" onclick="copyLatest()">复制结果</button><button class="secondary" onclick="zodiacStart()">重新选择</button></div>`);
}
function showHistory(){
  let a=[];try{a=JSON.parse(localStorage.getItem("xyg_history")||"[]")}catch(e){}
  openModal("我的探索记录",a.length?a.map(r=>`<div class="history-item"><b>${safe(r.type)} · ${safe(r.name)}</b><div class="muted">${safe(r.date)}</div><p>${safe(r.desc)}</p></div>`).join("")+
  `<div class="actions"><button class="secondary" onclick="clearHistory()">清空记录</button><button class="btn" onclick="closeModal()">完成</button></div>`:
  `<p class="muted">暂时没有记录。完成测试后，结果会保存在当前浏览器中。</p><button class="btn" onclick="closeModal()">返回</button>`);
}
function clearHistory(){
  if(confirm("确定清空本浏览器保存的结果吗？")){
    localStorage.removeItem("xyg_history");localStorage.removeItem("xyg_latest");showHistory();
  }
}
renderCards();
</script>
